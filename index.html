<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Mama — Cynthia P. Opeña</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:#fff;background:#8c155e}
button{font:inherit}
.app{width:100%;height:100%;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:
radial-gradient(ellipse at 15% 35%,rgba(255,150,198,.48),transparent 28%),
radial-gradient(ellipse at 88% 28%,rgba(255,160,210,.4),transparent 30%),
linear-gradient(145deg,#d34891 0%,#a21668 46%,#6b0e4d 100%);z-index:0}
.bg:before,.bg:after{content:"";position:absolute;border-radius:50%;filter:blur(8px);background:rgba(255,180,215,.3)}
.bg:before{width:420px;height:220px;left:-90px;top:220px;transform:rotate(-10deg)}
.bg:after{width:480px;height:230px;right:-110px;top:130px;transform:rotate(12deg)}

.page{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;transform:scale(.98);transition:.7s ease;padding:24px}
.page.active{opacity:1;visibility:visible;transform:scale(1)}
.script{font-family:"Great Vibes",cursive;font-weight:400}
.home-title{position:absolute;top:8vh;left:15px;right:15px}
.home-title .small{font-size:clamp(55px,8vw,105px);line-height:.9}
.home-title .big{font-size:clamp(75px,12vw,155px);line-height:.95;margin-top:15px}
.home-title p{font-family:"DM Serif Display",serif;font-size:clamp(15px,2vw,25px);margin:25px 0 0}
.gift-btn{position:absolute;top:66%;left:50%;width:170px;height:150px;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;filter:drop-shadow(0 20px 20px rgba(60,0,40,.3));transition:.25s}
.gift-btn:hover{transform:translate(-50%,-50%) scale(1.06)}
.box{position:absolute;left:20px;right:20px;bottom:8px;height:90px;border-radius:5px;background:linear-gradient(145deg,#fff,#f3b8d1);border:3px solid rgba(255,255,255,.8)}
.lid{position:absolute;left:12px;right:12px;bottom:88px;height:28px;border-radius:5px;background:#fff;border:3px solid rgba(255,255,255,.8);z-index:2}
.ribbonV{position:absolute;bottom:8px;left:73px;width:24px;height:108px;background:#fff;z-index:4}
.ribbonH{position:absolute;left:12px;right:12px;bottom:56px;height:20px;background:#ffd7e8;z-index:4}
.bow{position:absolute;top:24px;width:53px;height:32px;background:#fff;border-radius:60% 15%;z-index:5}
.bow.l{left:29px;transform:rotate(18deg)} .bow.r{right:29px;transform:scaleX(-1) rotate(18deg)}
.continue{position:absolute;top:84%;border:0;background:none;color:#fff;cursor:pointer;font-size:19px}
.continue small{display:block;font-size:11px;opacity:.75;margin-top:3px}
.back{position:absolute;left:22px;top:22px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;padding:11px 20px;cursor:pointer;z-index:20}

.flower-title{position:absolute;top:3vh;left:10px;right:10px;z-index:10}
.flower-title h2,.page-title{font:400 clamp(58px,8vw,105px)/1 "Great Vibes",cursive;margin:0;text-shadow:0 5px 22px rgba(255,180,220,.22)}
.flower-title p,.page-sub{font-size:clamp(13px,1.8vw,20px);margin:15px 0 0;text-shadow:0 2px 10px rgba(0,0,0,.12)}
.flower-stage{width:min(720px,96vw);height:min(560px,67vh);margin-top:145px;display:grid;place-items:center;position:relative}
.flower-stage:before{content:"";position:absolute;width:470px;height:250px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,174,215,.30),rgba(255,174,215,0) 68%);filter:blur(10px);bottom:65px;animation:bloomGlow 4s ease-in-out infinite}
.flower-stage:after{content:"";position:absolute;width:430px;height:24px;bottom:35px;border-radius:50%;background:rgba(50,0,35,.28);filter:blur(15px)}
.bouquet{position:relative;width:560px;height:500px;filter:drop-shadow(0 25px 30px rgba(45,0,32,.28))}
.bouquet:before{content:"";position:absolute;left:50%;top:120px;width:330px;height:250px;transform:translateX(-50%);background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.13),transparent 67%);filter:blur(8px);z-index:1}
.flower-pair{position:absolute;bottom:126px;width:0;height:0;z-index:5;--h:245px;--a:0deg;--d:0s;animation:bouquetSway 3.8s ease-in-out infinite;animation-delay:var(--d);transform-origin:bottom center}
.flower-pair .stem{position:absolute;left:-4px;bottom:0;width:8px;height:var(--h);background:linear-gradient(90deg,#397f4c,#79b95d,#397f4c);border-radius:99px;box-shadow:0 0 8px rgba(113,188,100,.22);z-index:2}
.flower-pair .tulip{position:absolute;left:-41px;bottom:var(--h);width:82px;height:94px;z-index:5;filter:drop-shadow(0 8px 8px rgba(80,0,45,.16))}
.flower-pair .tulip:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#fff9fc 0%,#ffd1e1 27%,#ff9fc4 62%,#cf4e87 100%);clip-path:polygon(2% 28%,16% 37%,29% 4%,45% 27%,55% 4%,70% 36%,86% 19%,100% 34%,96% 72%,82% 91%,52% 100%,18% 91%,3% 72%);border-radius:48% 48% 42% 42%;box-shadow:inset -9px -10px 12px rgba(165,40,100,.13),inset 10px 5px 14px rgba(255,255,255,.42)}
.flower-pair .tulip:after{content:"";position:absolute;left:23px;top:11px;width:12px;height:60px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));transform:rotate(9deg);filter:blur(.4px)}
.p1{left:34%;--h:235px;--a:-14deg;--d:.1s}.p2{left:43%;--h:270px;--a:-5deg;--d:.5s}.p3{left:52%;--h:285px;--a:5deg;--d:.8s}.p4{left:38%;--h:205px;--a:-20deg;--d:1.1s}.p5{left:66%;--h:205px;--a:20deg;--d:1.4s}.p6{left:47%;--h:225px;--a:-8deg;--d:1.7s}.p7{left:61%;--h:185px;--a:16deg;--d:2s}
.p4 .tulip{transform:scale(.78)}.p5 .tulip{transform:scale(.8)}.p6 .tulip{transform:scale(.82)}.p7 .tulip{transform:scale(.68)}
@keyframes bouquetSway{0%,100%{transform:rotate(calc(var(--a) - 1deg)) translateY(0)}50%{transform:rotate(calc(var(--a) + 3deg)) translateY(-5px)}}
.leaf{position:absolute;width:120px;height:46px;background:linear-gradient(135deg,#b2d66e 0%,#6ba84f 55%,#3d7e45 100%);border-radius:100% 0 100% 0;z-index:3;box-shadow:inset 5px 4px 8px rgba(255,255,255,.18);animation:leaf 4.2s ease-in-out infinite}
.leaf:after{content:"";position:absolute;width:80%;height:2px;left:8%;top:55%;background:rgba(42,101,54,.42);transform:rotate(-18deg);border-radius:50%}
.la{left:18%;bottom:220px;transform:rotate(24deg)}.lb{right:18%;bottom:220px;transform:scaleX(-1) rotate(24deg);animation-delay:.5s}.lc{left:12%;bottom:175px;transform:rotate(-13deg);animation-delay:1s}.ld{right:12%;bottom:175px;transform:scaleX(-1) rotate(-13deg);animation-delay:1.4s}.le{left:31%;bottom:180px;transform:rotate(36deg) scale(.82);animation-delay:1.8s}.lf{right:31%;bottom:180px;transform:scaleX(-1) rotate(36deg) scale(.82);animation-delay:2.1s}
@keyframes leaf{0%,100%{translate:0 0}50%{translate:0 -5px;rotate:4deg}}
.wrap{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:275px;height:190px;background:linear-gradient(135deg,#fff8fb 0%,#ffd9e9 42%,#e99abe 100%);clip-path:polygon(2% 0,98% 0,84% 100%,16% 100%);z-index:7;filter:drop-shadow(0 18px 15px rgba(40,0,30,.3))}
.wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.9),rgba(255,255,255,.18) 36%,transparent 62%),linear-gradient(180deg,rgba(255,255,255,.55),transparent 25%);clip-path:polygon(2% 0,98% 0,84% 100%,16% 100%)}
.wrap{overflow:visible}.wrap:before{z-index:1}.wrap:after{z-index:3}.wrap{border-top:10px solid rgba(255,255,255,.72);box-sizing:border-box}
.wrap:after{content:"♥";position:absolute;width:95px;height:34px;left:90px;top:82px;display:grid;place-items:center;color:#fff;font-size:24px;background:linear-gradient(135deg,#ee6fa9,#b93579);border-radius:8px 8px 45% 45%;box-shadow:0 7px 12px rgba(120,20,75,.25),0 0 0 4px rgba(255,255,255,.18)}
.bouquet:after{content:"";position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:300px;height:16px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);z-index:9;filter:blur(3px);opacity:.75}
.petal{position:absolute;top:-30px;width:15px;height:26px;border-radius:80% 20% 80% 20%;background:linear-gradient(135deg,#fff1f7,#ff9fc5);box-shadow:0 2px 7px rgba(255,130,180,.18);opacity:.88;animation:fall linear infinite;z-index:20}
@keyframes bloomGlow{0%,100%{scale:.96;opacity:.72}50%{scale:1.05;opacity:1}}
@keyframes fall{0%{translate:0 -50px;rotate:0}50%{translate:70px 55vh;rotate:220deg}100%{translate:-50px 110vh;rotate:500deg}}

.memories{justify-content:flex-start;padding-top:8vh}
.memories .page-title{font-size:clamp(55px,7vw,95px)}
.photo-scroll{width:min(1050px,94vw);height:67vh;overflow-y:auto;padding:15px 8px 50px;margin-top:15px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.photo{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);cursor:pointer}
.photo input{position:absolute;inset:0;opacity:0;z-index:5;cursor:pointer}
.photo img{display:none;width:100%;height:100%;object-fit:cover}.photo.has img{display:block}.photo.has .ph{display:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.ph b{font:400 30px "Great Vibes",cursive}.ph small{font-size:11px;opacity:.7}

.messages{justify-content:flex-start;padding-top:8vh}
.folders{width:min(950px,94vw);display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:22px;max-height:70vh;overflow:auto;padding:8px}
.folder{position:relative;border:0;min-height:145px;text-align:left;padding:38px 25px 20px;border-radius:10px;background:linear-gradient(145deg,#ffe8d7,#edbc96);color:#684034;box-shadow:0 15px 35px rgba(40,0,25,.25);cursor:pointer;transition:.25s;overflow:hidden}
.folder:hover{transform:translateY(-5px) rotate(-.5deg)}
.folder:before{content:"";position:absolute;left:0;top:0;width:105px;height:28px;background:#e6ae86;border-radius:0 0 12px 0}
.folder b{font:400 28px "DM Serif Display",serif}.folder small{display:block;margin-top:7px;opacity:.65}.folder .paper{position:absolute;right:25px;top:30px;width:60px;height:78px;background:#fff8ec;display:grid;place-items:center;font-size:25px;transform:rotate(5deg);box-shadow:0 5px 12px rgba(50,20,10,.15)}
.modal{position:absolute;inset:0;background:rgba(35,0,27,.65);backdrop-filter:blur(7px);display:none;place-items:center;padding:20px;z-index:50}
.modal.open{display:grid}.letter{position:relative;width:min(650px,92vw);max-height:82vh;overflow:auto;background:#fff6e9;color:#594039;padding:45px;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:left;line-height:1.8}
.close{position:absolute;right:15px;top:8px;border:0;background:none;font-size:30px;color:#8d536c;cursor:pointer}.letter h3{font:400 55px "Great Vibes",cursive;margin:5px 0 15px}.letter p{white-space:pre-line;font:18px/1.85 "DM Serif Display",serif}

@media(max-width:700px){
 .home-title{top:8vh}.gift-btn{top:67%}
 .bouquet{transform:scale(.78)}.flower-stage{margin-top:130px;height:55vh}
 .photo-grid{grid-template-columns:repeat(2,1fr)}
 .folders{grid-template-columns:1fr;max-height:68vh}
 .folder{min-height:125px}.page-title{font-size:60px}
}
@media(max-height:650px) and (orientation:landscape){
 .home-title{top:4vh}.home-title .small{font-size:55px}.home-title .big{font-size:72px}.home-title p{margin-top:8px}
 .gift-btn{top:65%;transform:translate(-50%,-50%) scale(.72)}.continue{top:88%}
 .flower-title{top:2vh}.flower-stage{margin-top:90px;height:65vh}.bouquet{transform:scale(.62)}
}
</style>
</head>
<body>
<div class="app">
<div class="bg"></div>

<section class="page active" id="home">
  <div class="home-title">
    <div class="script small">Happy Birthday,</div>
    <div class="script big">Mama!</div>
    <p>Cheers to another beautiful chapter of your life.</p>
  </div>
  <button class="gift-btn" onclick="startSurprise()">
    <span class="lid"></span><span class="box"></span><span class="ribbonV"></span><span class="ribbonH"></span>
    <span class="bow l"></span><span class="bow r"></span>
  </button>
  <button class="continue" onclick="startSurprise()">Continue ♡<small>click the gift to get started</small></button>
</section>

<section class="page" id="flowers">
  <button class="back" onclick="showPage('home')">← Back</button>
  <div class="flower-title">
    <h2>Flowers for You!</h2>
    <p>Because you deserve a garden full of beautiful things.</p>

      <div class="wrap"></div>
    </div>
  </div>
  <div id="petals"></div>
  <button class="continue" style="top:auto;bottom:20px" onclick="showPage('memories')">Continue ♡</button>
</section>
